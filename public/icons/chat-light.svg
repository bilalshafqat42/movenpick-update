<svg width="162" height="162" viewBox="-4 -4 162 162" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  viewBox is inset by 4 units on every side so the circle (cx 77,
  cy 77, r 77) sits centred with 4 units of clearance all round. At
  "0 0 154 154" it was flush against the box on all four edges, which
  left the rim with nowhere to antialias and made the CSS
  border-radius clip shave the whole outline.

  Geometry matches top-light.svg / top-dark.svg exactly, so the chat
  and back-to-top buttons render at the same diameter side by side.
-->
